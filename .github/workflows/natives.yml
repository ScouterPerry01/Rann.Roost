# File path and name: .github/workflows/natives.yml
# Modified On Timestamp: 2026-10-12 @ 19:16 EDT
# Created On Timestamp: 2026-10-04 @ 03:58 EDT
# File Description: Builds the Windows HEIC helper by hand.
# Uses: tools/natives/wic, the Visual Studio tools on the runner, actions/upload-artifact.
# Used By: the owner, run by hand after changing the helper.
# Purpose: Reproduce the committed helper and compare its SHA-256.

# Rebuilds the Windows HEIC helper (tools/natives/wic, ADR 0004) and prints its SHA-256, to compare
# with the copy committed in core/ocr-desktop/src/main/resources/hfm/heif/native. It contains no
# codec: Windows decodes HEIC with the extensions the user installs. Run by hand after changing it.
name: Native libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build hfmwic.dll
        shell: pwsh
        run: |
          powershell -NoProfile -File tools/natives/build-wic.ps1 -Out out -Work "$env:RUNNER_TEMP\wic"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-FileHash out/hfmwic.dll
      - uses: actions/upload-artifact@v7
        with:
          name: hfmwic-windows-x86_64
          path: out/
